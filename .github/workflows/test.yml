name: Check
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Chekout
        uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: lint
        run: npm run lint
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Chekout
        uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Test
        env: 
          PORT: ${{ secrets.PORT }}
        run: npm run test